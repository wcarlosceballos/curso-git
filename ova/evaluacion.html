<main>
<div class="quiz">
<h3>1. ¿Qué comando sube tus commits al remoto?</h3>
<button onclick="resp(this)">git pull</button><button data-ok="1" onclick="resp(this)">git push</button><button onclick="resp(this)">git clone</button><br>
<h3>2. ¿Cuál es el ciclo correcto?</h3>
<button data-ok="1" onclick="resp(this)">add → commit → push</button><button onclick="resp(this)">commit → add → push</button><br>
<h3>3. ¿Para qué sirve git init?</h3>
<button data-ok="1" onclick="resp(this)">Inicializar un repositorio (una vez)</button><button onclick="resp(this)">Crear una rama</button><br>
<p id="res"></p>
</div>
<script>
let score=0, total=3, answered={};
function resp(btn){
  const id=btn.closest('div').id||btn.previousElementSibling;
  const correct = btn.hasAttribute('data-ok');
  document.getElementById('res').textContent = correct ? '✅ ¡Correcto!' : '❌ Intenta de nuevo';
  if(correct && !btn.dataset.done){score++;btn.dataset.done='1';}
  document.getElementById('res').textContent += '  — Puntaje: '+score+'/'+total;
}
</script>
